<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png">
    <title>KTU CGPA Calculator</title>
</head>
<body>  
    <h1>KTU CGPA Calculator</h1>
    <div class="menuIconContainer">
        <p>For the cyber people.</p>
        <button id="menuToggle" onclick="toggleMenu()">☰</button>
    </div>
    <div id="topButtons">
        <select name="Department" id="deparmentSelect"></select>
        <input type="file" id="acceptData" accept=".json">
        <label for="acceptData" class="fileInputLabel">Load Data from file</label>
        <button class="headerBtn" id="downloadBtn" onclick="downloadData()">Download JSON Data</button>
        <button class="headerBtn" id="themeBtn" onclick="toggleTheme()">Change Theme</button>
   </div>
    <h2 id="cgpah1">CGPA: 0.00</h2>
    <dialog id="dialogBox">
        <h2>Error: Invalid json file</h2>
        <p>Please ensure that the json file is downloaded from this site.</p>
        <button class="closeBtn" onclick="closeDialog()">Close</button>
    </dialog>
    <div id="tables"></div>
    <hr><br><br>
    <footer>2026 · <a href="https://birdman58.github.io/portfolio/"> BirdMan58 </a></footer>
</body>
<script src="script.js"></script>
</html>
