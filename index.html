<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png">
    <title>KTU CGPA Calculator</title>
</head>
<body>  
    <h1>KTU CGPA Calculator</h1>
    <div class="menuIconContainer">
        <p>For the cyber people.</p>
        <button id="menuToggle" onclick="toggleMenu()">☰</button>
    </div>
    <div id="topButtons">
        <select name="Department" id="deparmentSelect">
            <option value="nil" selected>Change Department</option>
            <option value="cy">CSE(Cyber Security)</option>
            <option value="ad">Artificial Intelligence and Data Science</option>
            <option value="ce">Civil Engineering</option>
            <option value="cse">Computer Science Engineering</option>
            <option value="ece">Electronics and Communication Engineering</option>
            <option value="eee">Electrical and Electronics Engineering</option>
            <option value="me">Mechanical Engineering</option>
            <option value="mr">Mechatronics Engineering</option>
        </select>
        <input type="file" id="acceptData" accept=".json">
        <label for="acceptData" class="fileInputLabel">Load Data from file</label>
        <button class="headerBtn" id="downloadBtn" onclick="downloadData()">Download JSON Data</button>
        <button class="headerBtn" id="themeBtn" onclick="toggleTheme()">Change Theme</button>
   </div>
    <h2 id="cgpah1">CGPA: 0.00</h2>
    <div id="tables"></div>
    <hr><br><br>
    <footer>2026 · <a href="https://github.com/BirdMan58"> BirdMan58 </a></footer>
</body>
<script src="script.js"></script>
</html>
